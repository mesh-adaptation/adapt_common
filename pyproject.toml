[build-system]
requires = ["setuptools"]

[project]
name = "adapt_common"
version = "0.1"
authors = [
  {name = "Joseph G. Wallwork", email = "joe.wallwork@outlook.com"},
  {name = "Stephan C. Kramer"},
]
maintainers = [
  {name = "Joseph G. Wallwork", email = "joe.wallwork@outlook.com"},
  {name = "Stephan C. Kramer"},
]
description = "Common functionality of Mesh Adaptation packages for Firedrake"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["python", "meshing", "finite-element-method", "firedrake"]
classifiers = [
	"Development Status :: 4 - Beta",
	"Programming Language :: Python",
]
dependencies = [
  "numpy",
  "vtk",
]

[project.optional-dependencies]
dev = [
  "coverage",
  "parameterized",
  "pre-commit",
  "pytest",
  "ruff",
]

[project.urls]
Repository = "https://github.com/mesh-adaptation/adapt_common"

[tool.setuptools]
packages = ["adapt_common"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
  "B",  # flake8-bugbear
  "C",  # mccabe complexity
  "E", "W",  # Pycodestyle
  "F",  # Pyflakes
  "I",  # isort
]
